<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ePCR - Mezzo</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#c62828" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f2f2;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---- Header ---- */
  header {
    background: #1a1a1a;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #stato-connessione {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #444;
  }
  #stato-connessione.online { background: #2e7d32; }
  #stato-connessione.offline { background: #b71c1c; }

  main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; }

  /* ---- Schermata selezione mezzo ---- */
  #schermata-selezione { display: flex; flex-direction: column; gap: 12px; }
  #schermata-selezione p { color: #555; font-size: 14px; margin: 0 0 4px; }
  .lista-mezzi { display: flex; flex-direction: column; gap: 10px; }
  .mezzo-btn {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mezzo-btn .targa { font-size: 13px; font-weight: 400; color: #888; }
  .mezzo-btn .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    color: #fff;
    background: #9e9e9e;
    text-transform: uppercase;
  }
  .mezzo-btn .badge.disponibile { background: #2e7d32; }
  .mezzo-btn .badge.impegnato { background: #ef6c00; }
  .mezzo-btn .badge.fuori_servizio { background: #757575; }

  /* ---- Schermata attesa ---- */
  #schermata-attesa { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
  #schermata-attesa .mezzo-corrente { font-size: 20px; font-weight: 700; }
  #schermata-attesa .sottotitolo { color: #666; font-size: 15px; }
  #schermata-attesa .pallino {
    width: 12px; height: 12px; border-radius: 50%; background: #2e7d32;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%{opacity:.3} 50%{opacity:1} 100%{opacity:.3} }
  #cambia-mezzo { margin-top: 20px; background: none; border: none; color: #1565c0; font-size: 14px; text-decoration: underline; }

  /* ---- Schermata attivazione (allarme) ---- */
  #schermata-attivazione {
    display: none;
    position: fixed; inset: 0;
    background: #c62828;
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 16px;
    z-index: 100;
    animation: flash 1s infinite;
  }
  @keyframes flash { 0%,100% { background:#c62828; } 50% { background:#8e0000; } }
  #schermata-attivazione .titolo { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  #schermata-attivazione .tipologia { font-size: 15px; text-transform: uppercase; opacity: .9; letter-spacing: 1px; }
  #schermata-attivazione .indirizzo { font-size: 24px; font-weight: 600; max-width: 90%; }
  #schermata-attivazione .note { font-size: 15px; opacity: .9; max-width: 90%; }
  #schermata-attivazione .link-mappa { color: #fff; text-decoration: underline; font-size: 14px; }
  #conferma-btn {
    margin-top: 12px;
    background: #fff;
    color: #c62828;
    border: none;
    border-radius: 14px;
    padding: 18px 32px;
    font-size: 19px;
    font-weight: 800;
    width: 100%;
    max-width: 340px;
  }

  button { cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>ePCR &middot; Postazione Mezzo</h1>
  <span id="stato-connessione">connessione...</span>
</header>

<main>
  <!-- Selezione del mezzo dalla lista -->
  <section id="schermata-selezione">
    <p>Seleziona il mezzo su cui sei in servizio:</p>
    <div id="lista-mezzi" class="lista-mezzi">
      <p id="caricamento-mezzi">Carico l'elenco mezzi...</p>
    </div>
  </section>

  <!-- In attesa di attivazione -->
  <section id="schermata-attesa">
    <div class="pallino"></div>
    <div class="mezzo-corrente" id="nome-mezzo-corrente"></div>
    <div class="sottotitolo">In attesa di attivazione dalla centrale...</div>
    <div class="sottotitolo">Tieni questa pagina aperta sullo schermo.</div>
    <button id="cambia-mezzo">Cambia mezzo</button>
  </section>
</main>

<!-- Schermata a tutto schermo mostrata quando arriva un'attivazione -->
<section id="schermata-attivazione">
  <div class="titolo">ATTIVAZIONE</div>
  <div class="tipologia" id="att-tipologia"></div>
  <div class="indirizzo" id="att-indirizzo"></div>
  <div class="note" id="att-note"></div>
  <a class="link-mappa" id="att-mappa" href="#" target="_blank" rel="noopener">Apri indirizzo in mappa</a>
  <button id="conferma-btn">CONFERMA PRESA IN CARICO</button>
</section>

<audio id="suono-attivazione" loop preload="auto">
  <source src="attivazione.mp3" type="audio/mpeg" />
</audio>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function () {
  // ---------------------------------------------------------------
  // Configurazione: URL del backend. Modificalo con il tuo dominio
  // Render (es. https://epcr-backend.onrender.com) prima del deploy,
  // oppure passalo come ?api=https://... nella URL della pagina.
  // ---------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const API_URL = params.get("api") || "https://epcr-system.onrender.com"; localStorage.setItem("epcr_api_url", API_URL);

  const STORAGE_KEY = "epcr_mezzo_selezionato";

  const elSelezione = document.getElementById("schermata-selezione");
  const elAttesa = document.getElementById("schermata-attesa");
  const elAttivazione = document.getElementById("schermata-attivazione");
  const elListaMezzi = document.getElementById("lista-mezzi");
  const elNomeMezzoCorrente = document.getElementById("nome-mezzo-corrente");
  const elStatoConnessione = document.getElementById("stato-connessione");
  const elSuono = document.getElementById("suono-attivazione");

  let mezzoSelezionato = null; // { id, nome }
  let interventoCorrente = null; // { interventoId, mezzoId }
  let socket = null;

  function vaiA(schermata) {
    elSelezione.style.display = schermata === "selezione" ? "flex" : "none";
    elAttesa.style.display = schermata === "attesa" ? "flex" : "none";
    elAttivazione.style.display = schermata === "attivazione" ? "flex" : "none";
  }

  function badgeClasse(stato) {
    return { disponibile: "disponibile", impegnato: "impegnato", fuori_servizio: "fuori_servizio" }[stato] || "";
  }

  async function caricaMezzi() {
    elListaMezzi.innerHTML = "<p>Carico l'elenco mezzi...</p>";
    try {
      const res = await fetch(`${API_URL}/mezzi`);
      if (!res.ok) throw new Error("risposta non ok");
      const mezzi = await res.json();

      if (!mezzi.length) {
        elListaMezzi.innerHTML = "<p>Nessun mezzo configurato. Contatta la centrale.</p>";
        return;
      }

      elListaMezzi.innerHTML = "";
      mezzi.forEach((m) => {
        const btn = document.createElement("button");
        btn.className = "mezzo-btn";
        btn.innerHTML = `
          <span>${m.nome}${m.targa ? `<br/><span class="targa">${m.targa}</span>` : ""}</span>
          <span class="badge ${badgeClasse(m.stato)}">${m.stato.replace("_", " ")}</span>
        `;
        btn.addEventListener("click", () => selezionaMezzo({ id: m.id, nome: m.nome }));
        elListaMezzi.appendChild(btn);
      });
    } catch (err) {
      elListaMezzi.innerHTML = `<p>Impossibile contattare il backend (${API_URL}). Verifica la connessione o l'indirizzo del server.</p>`;
    }
  }

  function selezionaMezzo(mezzo) {
    mezzoSelezionato = mezzo;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(mezzo));
    elNomeMezzoCorrente.textContent = mezzo.nome;
    vaiA("attesa");
    connettiSocket();
  }

  function connettiSocket() {
    if (socket) socket.disconnect();

    socket = io(API_URL, { transports: ["websocket", "polling"] });

    socket.on("connect", () => {
      elStatoConnessione.textContent = "online";
      elStatoConnessione.className = "online";
      socket.emit("registra", { ruolo: "mezzo", id: mezzoSelezionato.id });
    });

    socket.on("disconnect", () => {
      elStatoConnessione.textContent = "offline";
      elStatoConnessione.className = "offline";
    });

    socket.on("connect_error", () => {
      elStatoConnessione.textContent = "errore connessione";
      elStatoConnessione.className = "offline";
    });

    // Evento inviato dal backend quando la centrale assegna un intervento a QUESTO mezzo
    socket.on("attivazione", (dati) => {
      mostraAttivazione(dati);
    });
  }

  function mostraAttivazione(dati) {
    interventoCorrente = dati;
    document.getElementById("att-tipologia").textContent = dati.tipologia || "";
    document.getElementById("att-indirizzo").textContent = dati.indirizzo || "";
    document.getElementById("att-note").textContent = dati.note || "";

    const linkMappa = document.getElementById("att-mappa");
    if (dati.lat && dati.lon) {
      linkMappa.href = `https://www.google.com/maps/search/?api=1&query=${dati.lat},${dati.lon}`;
    } else if (dati.indirizzo) {
      linkMappa.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dati.indirizzo)}`;
    }

    vaiA("attivazione");

    // Suono e vibrazione per attirare l'attenzione (funzionano solo a pagina aperta/attiva:
    // un browser web non può "svegliare" il telefono a schermo spento come farebbe una vera
    // push notification nativa - per quello serve l'app mobile o una configurazione Web Push).
    elSuono.currentTime = 0;
    elSuono.play().catch(() => {/* alcuni browser bloccano l'autoplay senza interazione utente */});
    if (navigator.vibrate) navigator.vibrate([500, 250, 500, 250, 500]);
  }

  async function confermaPresaInCarico() {
    if (!interventoCorrente) return;
    elSuono.pause();
    if (navigator.vibrate) navigator.vibrate(0);

    try {
      await fetch(`${API_URL}/interventi/${interventoCorrente.interventoId}/conferma-mezzo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mezzoId: mezzoSelezionato.id }),
      });
    } catch (err) {
      console.error("Errore invio conferma:", err);
    }

    interventoCorrente = null;
    vaiA("attesa");
  }

  document.getElementById("conferma-btn").addEventListener("click", confermaPresaInCarico);
  document.getElementById("cambia-mezzo").addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);
    if (socket) socket.disconnect();
    mezzoSelezionato = null;
    vaiA("selezione");
    caricaMezzi();
  });

  // All'avvio: se il mezzo era già stato scelto in precedenza, riparti da lì
  const salvato = localStorage.getItem(STORAGE_KEY);
  if (salvato) {
    try {
      selezionaMezzo(JSON.parse(salvato));
    } catch {
      vaiA("selezione");
      caricaMezzi();
    }
  } else {
    vaiA("selezione");
    caricaMezzi();
  }
})();
</script>
</body>
</html>
