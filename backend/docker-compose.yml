services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: epcr
      POSTGRES_PASSWORD: iris_dev_password
      POSTGRES_DB: epcr
    ports:
      - "5432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  iris_pgdata:
