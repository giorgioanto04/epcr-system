services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris-v2
      POSTGRES_PASSWORD: iris-v2_dev_password
      POSTGRES_DB: iris-v2
    ports:
      - "5432:5432"
    volumes:
      - iris-v2_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  iris-v2_pgdata:
